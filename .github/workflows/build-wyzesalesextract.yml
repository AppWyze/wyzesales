name: Build WyzeSalesExtract

# Two jobs this serves at once:
#
# 1. A safety net that didn't exist before: every push that touches WyzeSalesExtract now
#    actually gets compiled and self-tested on a real machine. No tool available to build this
#    program (this cloud sandbox, the bridge into Craig's Mac) has ever had the .NET SDK or
#    been able to reach nuget.org (both confirmed directly, 2026-09-22) - so until now, nothing
#    had ever actually compiled a single line of C# written for this project. This workflow is
#    the first thing that does.
#
# 2. The "press a button" build step for the WyzeSalesExtract-per-client workflow (Craig,
#    2026-09-22): trigger this manually (or, later, from Platform Admin via GitHub's API) and
#    download WyzeSalesExtract.exe from the finished run's artifacts - no local dotnet install
#    needed anywhere.
#
# Deliberately does NOT take any client-specific input or produce a client-specific exe in the
# sense of different SOURCE per client: the same compiled program already supports every client
# whose ISourceExtractor is compiled in - Source.Type in THAT SERVER's own appsettings.json is
# what picks which one actually runs (see WyzeSalesExtract/README.md "Adding a new client"). One
# build serves every client at once; only the config differs between them, and that config -
# especially the Supabase connection string - deliberately never passes through this workflow or
# gets baked into the exe, so it never ends up in an Actions log or a downloadable artifact.
#
# 2026-10-01: now builds TWO architectures, not one. Every client so far (WCSA, Edgetec) has a
# 64-bit-visible ODBC DSN, but Morgenster's turned out to be 32-bit-only (Sage Pastel Partner's
# Pervasive ODBC Engine Interface - see WyzeSalesExtract/README.md "Adding a new client" item 7)
# - a win-x64 exe simply cannot open that DSN, no config change fixes it, only a win-x86 build
# does. Rather than make this workflow client-aware (which the comment above still holds against
# - no client-specific build logic), it builds both architectures every time and uploads both as
# separate artifacts; whoever's installing a given client picks the matching one (win-x64 for
# WCSA/Edgetec, win-x86 for Morgenster - the installation guide for each client says which).
on:
  push:
    branches: [main]
    paths:
      - "WyzeSalesExtract/**"
      - ".github/workflows/build-wyzesalesextract.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Matches the actual target OS (self-contained, Windows Service APIs) rather than
    # cross-compiling from Linux - this workflow can't be test-run before Craig sees the
    # result, so the safest choice was taken over the faster one. A win-x86 exe runs fine on
    # this (64-bit) runner via WOW64, same as on any 64-bit Windows Server - no separate x86
    # runner needed to build or self-test it.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WyzeSalesExtract
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish (${{ matrix.rid }}, self-contained, single file)
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish-${{ matrix.rid }}

      # Runs the exe's own --selftest (Domain/SelfTest.cs) on the built artifact itself, not
      # just the source - proves the date-math and scheduler logic actually work on a real
      # machine before anyone downloads this build. Needs no database connection. A failure
      # here fails the whole workflow run, on purpose - nothing gets published as an artifact
      # from a build that fails its own self-test. Runs for both architectures - a win-x86
      # build that fails its self-test is exactly as unfit to ship as a win-x64 one would be.
      - name: Run built-in self-test
        shell: pwsh
        run: .\publish-${{ matrix.rid }}\WyzeSalesExtract.exe --selftest

      - name: Upload WyzeSalesExtract.exe (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: WyzeSalesExtract-${{ matrix.rid }}-${{ github.sha }}
          path: WyzeSalesExtract/publish-${{ matrix.rid }}/WyzeSalesExtract.exe
          retention-days: 90
